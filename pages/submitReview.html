<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post Your Review</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .stars {
      display: inline-block;
    }
    .star {
      font-size: 2em;
      cursor: pointer;
      color: #ccc;
    }
    .star.selected {
      color: gold;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      box-sizing: border-box;
    }
    textarea {
      width: 100%;
      height: 100px;
      resize: vertical;
      margin-top: 10px;
    }
    label {
      display: block;
      margin-top: 20px;
    }
    button {
      margin-top: 20px;
      padding: 10px 15px;
      font-size: 1em;
    }
    #message {
      margin-top: 20px;
      font-weight: bold;
    }
    #message.error {
      color: red;
    }
    #message.success {
      color: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Review Your Reservation</h1>
    <form id="review-form">
      <div>
        <label>Rating:</label>
        <div id="star-rating" class="stars">
          <span class="star" data-value="1">&#9733;</span>
          <span class="star" data-value="2">&#9733;</span>
          <span class="star" data-value="3">&#9733;</span>
          <span class="star" data-value="4">&#9733;</span>
          <span class="star" data-value="5">&#9733;</span>
        </div>
        <!-- Hidden input to store the numeric rating -->
        <input type="hidden" id="rating" name="rating" value="0" required>
      </div>
      <div>
        <label for="title">Review Title:</label>
        <input type="text" id="title" name="title" placeholder="Enter review title" required>
      </div>
      <div>
        <label for="comment">Your Review:</label>
        <textarea id="comment" name="comment" placeholder="Write your review here..." required></textarea>
      </div>
      <div>
        <button type="submit">Submit Review</button>
      </div>
      <div id="message"></div>
    </form>
  </div>
  <script src="../assets/js/submitReview.js"></script>
</body>
</html>
