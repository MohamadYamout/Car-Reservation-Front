<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post Your Review</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .star-rating {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .star {
      font-size: 2em;
      cursor: pointer;
      color: #ccc;
      transition: color 0.2s;
    }

    .star.fas {
      color: gold;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      box-sizing: border-box;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    label {
      display: block;
      margin-top: 20px;
    }

    button {
      margin-top: 20px;
      padding: 10px 15px;
      font-size: 1em;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }

    #message.error {
      color: red;
    }

    #message.success {
      color: green;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Review Your Reservation</h1>
    <form id="review-form">
      <div>
        <label>Rating:</label>
        <div class="star-rating">
          <i class="far fa-star star" data-value="1"></i>
          <i class="far fa-star star" data-value="2"></i>
          <i class="far fa-star star" data-value="3"></i>
          <i class="far fa-star star" data-value="4"></i>
          <i class="far fa-star star" data-value="5"></i>
        </div>
        <input type="hidden" id="rating" name="rating" value="0" required>
      </div>

      <div>
        <label for="title">Review Title:</label>
        <input type="text" id="title" name="title" placeholder="Enter review title" required>
      </div>

      <div>
        <label for="comment">Your Review:</label>
        <textarea id="comment" name="comment" placeholder="Write your review here..." required></textarea>
      </div>

      <div>
        <button type="submit">Submit Review</button>
      </div>

      <div id="message"></div>
    </form>
  </div>

  <script src="../assets/js/submitReview.js"></script>
</body>

</html>
