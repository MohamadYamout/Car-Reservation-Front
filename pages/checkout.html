<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarReserve - Checkout</title>
  <link rel="stylesheet" href="assets/css/landing.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="container">
      <nav>
        <div class="logo">CarReserve</div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="checkout.html">Checkout</a></li>
          <li><a href="bookings.html">Bookings</a></li>
          <li><a href="invoices.html">Invoices</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="chat.html">Chat</a></li>
        </ul>
        <div class="menu-btn">☰</div>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <h1>Checkout</h1>
    
    <!-- Order Summary Display -->
    <section id="orderDisplay">
      <h2>Your Rental Order</h2>
      <div id="orderDetails"></div>
      <h3>Total Price: $<span id="orderTotal">0.00</span></h3>
      <p id="loyaltyMsg" style="font-weight:bold; color:green;"></p>
    </section>

    <!-- Personal Information Form -->
    <section>
      <h2>Personal Information</h2>
      <form id="personalInfoForm">
        <label for="custName">Name:</label>
        <input type="text" id="custName" required><br>
        <label for="custEmail">Email:</label>
        <input type="email" id="custEmail" required><br>
        <label for="custPhone">Phone:</label>
        <input type="tel" id="custPhone" required><br>
      </form>
    </section>

    <!-- Payment Method -->
    <section>
      <h2>Payment Method</h2>
      <form id="paymentForm">
        <input type="radio" id="cc" name="payment" value="Credit Card" required>
        <label for="cc">Credit Card</label><br>
        <input type="radio" id="payAtLoc" name="payment" value="Pay at location">
        <label for="payAtLoc">Pay at Location</label><br>
      </form>
    </section>

    <!-- Credit Card Payment Fields -->
    <section id="creditCardSection" style="display: none;">
      <h2>Credit Card Details</h2>
      <form id="creditCardForm">
        <label for="cardHolderName">Card Holder Name:</label>
        <input type="text" id="cardHolderName" required placeholder="e.g. John Doe"><br>
        
        <label for="cardNumber">Card Number:</label>
        <input type="text" id="cardNumber" required
               pattern="\d{13,19}"
               title="Enter a valid card number (13 to 19 digits). Only one Visa card is allowed."
               placeholder="Enter 13-19 digit card number"><br>
        
        <label for="expiryMonth">Expiry Month (MM):</label>
        <input type="number" id="expiryMonth" required 
               min="1" max="12" 
               placeholder="01 to 12"><br>
        
        <label for="expiryYear">Expiry Year (YYYY):</label>
        <input type="number" id="expiryYear" required 
               placeholder="e.g. 2025 or later"><br>
        
        <label for="cvv">CVV:</label>
        <input type="password" id="cvv" required
               pattern="\d{3,4}"
               placeholder="e.g. 123"><br>
      </form>
    </section>

    <!-- Discount Coupon -->
    <section>
      <h2>Discount Coupon</h2>
      <input type="text" id="couponCode" placeholder="Enter coupon code">
      <button id="applyCoupon">Apply Coupon</button>
      <p id="couponMsg"></p>
    </section>

    <!-- Transaction Options -->
    <section>
      <h2>Transaction Options</h2>
      <button id="saveTransaction">Save Transaction</button>
      <button id="completeTransaction">Complete Transaction</button>
      <button id="cancelTransaction">Cancel Transaction</button>
      <button id="requestQuotation">Request Quotation</button>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <!-- ... unchanged ... -->
  </footer>

  <script>
    document.querySelector('.menu-btn').addEventListener('click', function() {
      document.querySelector('.nav-links').classList.toggle('active');
    });
  </script>
  <script src="../assets/js/checkout.js"></script>
</body>
</html>
