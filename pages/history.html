<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking History - CarReserve</title>
  <link rel="stylesheet" href="../assets/css/landing.css" />

</head>
<body>
  <!-- Header -->
  <header>
    <div class="container">
      <nav>
        <div class="logo">CarReserve</div>
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="../index.html#features">Features</a></li>
          <li><a href="../index.html#about">About</a></li>
          <li><a href="../index.html#contact">Contact</a></li>
        </ul>
        <div class="menu-btn">☰</div>
      </nav>

  <!-- Booking History Section -->
  <div class="history-container">
    <div class="history-header">
      <h1>Your Booking History</h1>
      <p>View and manage your previous car reservations</p>
    </div>

    <div class="booking-grid" id="bookingGrid">
      <!-- Booking cards will be dynamically inserted here -->
    </div>

    <!-- No bookings message (hidden by default) -->
    <div class="no-bookings" id="noBookings" style="display: none;">
      <h3>No Bookings Found</h3>
      <p>You haven't made any car reservations yet.</p>
      <a href="reservation.html" class="btn">Make Your First Reservation</a>
    </div>
  </div>

  <script src="../assets/js/history.js"></script>
