<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Car Rental - Filter & Groups</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <script src="../assets/js/cargroups.js" defer></script>
</head>
<body>
  <header>
    <h1>Car Rental</h1>
  </header>

  <!-- SECTION 1: FILTER ALL CARS IRRESPECTIVE OF GROUP -->
  <section id="filterSection">
    <h2>All Available Cars</h2>
    <form id="filterForm">
      <label for="engineSizeRange">Engine Size Range:</label>
      <select id="engineSizeRange" name="engineSizeRange">
        <option value="">Any</option>
        <option value="0-1000">0 - 1000 cc</option>
        <option value="1001-2000">1001 - 2000 cc</option>
        <option value="2001-3000">2001 - 3000 cc</option>
        <option value="3001+">3001+ cc</option>
      </select>
      <br /><br />
      <label for="minDoors">Min Doors:</label>
      <input type="number" id="minDoors" name="minDoors" min="1" />
      <label for="maxDoors">Max Doors:</label>
      <input type="number" id="maxDoors" name="maxDoors" min="1" max="4" />
      <br /><br />
      <label for="minPassengers">Min Passengers:</label>
      <input type="number" id="minPassengers" name="minPassengers" min="1" />
      <label for="maxPassengers">Max Passengers:</label>
      <input type="number" id="maxPassengers" name="maxPassengers" min="1" max="15" />
      <br /><br />
      <label for="gearboxSelect">Gearbox:</label>
      <select id="gearboxSelect" name="gearboxSelect">
        <option value="">Any</option>
        <option value="Automatic">Automatic</option>
        <option value="Manual">Manual</option>
      </select>
      <br /><br />
      <label for="acSelect">AC:</label>
      <select id="acSelect" name="acSelect">
        <option value="">Any</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
      <label for="windowsSelect">Electric Windows:</label>
      <select id="windowsSelect" name="windowsSelect">
        <option value="">Any</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
      <br /><br />
      <button type="submit">Filter</button>
    </form>
    <br />
    <div id="filteredCarsContainer"></div>
  </section>

  <hr />

  <!-- SECTION 2: SELECT A CAR GROUP & VIEW CARS IN THAT GROUP -->
  <section>
    <h2>Select a Car Group</h2>
    <div id="carGroupsContainer"></div>
  </section>
  <section>
    <div id="groupSpecsContainer"></div>
  </section>

  <hr />

  <!-- SECTION 3: AVAILABLE CARS (Group-based) -->
  <section>
    <h2>Available Cars</h2>
    <div id="carGalleryContainer"></div>
  </section>

  <hr />

  <!-- SECTION 4: NEXT BUTTON -->
  <section id="nextSection">
    <div class="container">
      <button id="nextBtn" class="btn">Next</button>
      <span id="nextError" style="color: red; margin-left: 10px;"></span>
    </div>
  </section>
</body>
</html>
