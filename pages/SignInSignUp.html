<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up - CarReserve</title>
    <link rel="stylesheet" href="../assets/css/SignInSignUp.css">
    <script src="../assets/js/SignInSignUp.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Welcome to CarReserve</h1>
            <p>Please sign in or create an account to continue</p>
        </div>

        <div id="signup-form" class="auth-form">
            <h2>Sign Up</h2>
            <div class="form-group">
                <label for="signup-email">Email Address</label>
                <input type="email" id="signup-email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="Create a password">
            </div>
            <button class="auth-btn" onclick="signUp()">Create Account</button>
        </div>

        <div id="signin-form" class="auth-form">
            <h2>Sign In</h2>
            <div class="form-group">
                <label for="signin-email">Email Address</label>
                <input type="email" id="signin-email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="signin-password">Password</label>
                <input type="password" id="signin-password" placeholder="Enter your password">
            </div>
            <button class="auth-btn" onclick="signIn()">Sign In</button>
        </div>

        <div class="auth-divider">
            <span>or</span>
        </div>

        <div class="auth-switch">
            <a href="#" onclick="toggleAuth()">Already have an account? Sign in</a>
        </div>
    </div>

    <div id="message-box"></div>

    <script>
        // Initial state
        const signUpForm = document.getElementById('signup-form');
        const signInForm = document.getElementById('signin-form');
        const switchText = document.querySelector('.auth-switch a');
        
        function toggleAuth() {
            if (signUpForm.style.display !== 'none') {
                signUpForm.style.display = 'none';
                signInForm.style.display = 'block';
                switchText.textContent = "Don't have an account? Sign up";
            } else {
                signUpForm.style.display = 'block';
                signInForm.style.display = 'none';
                switchText.textContent = "Already have an account? Sign in";
            }
        }
    </script>
</body>
</html>
