<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Sign In / Sign Up - CarReserve</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/SignInSignUp.css" />
    <script src="../assets/js/SignInSignUp.js" defer></script>
</head>

<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Welcome to <br><strong>CarReserve</strong></h1>
            <p>Please sign in or create an account to continue</p>
        </div>

        <!-- Sign Up Form -->
        <div id="signup-form" class="auth-form">
            <h2>Sign Up</h2>

            <div class="input-icon">
                <i class="fa fa-user"></i>
                <input type="text" id="signup-firstname" placeholder="First Name" />
            </div>

            <div class="input-icon">
                <i class="fa fa-user"></i>
                <input type="text" id="signup-lastname" placeholder="Last Name" />
            </div>

            <div class="input-icon">
                <i class="fa fa-phone"></i>
                <input type="tel" id="signup-phone" placeholder="Phone Number" />
            </div>

            <div class="input-icon">
                <i class="fa fa-envelope"></i>
                <input type="email" id="signup-email" placeholder="Email Address" />
            </div>

            <div class="input-icon">
                <i class="fa fa-lock"></i>
                <input type="password" id="signup-password" placeholder="Password" />
            </div>

            <div class="input-icon">
                <i class="fa fa-lock"></i>
                <input type="password" id="signup-confirm-password" placeholder="Confirm Password" />
            </div>

            <button onclick="signUp()">Create Account</button>
            <div id="signup-message-box" class="message-box"></div>
        </div>

        <!-- Sign In Form -->
        <div id="signin-form" class="auth-form hidden">
            <h2>Sign In</h2>

            <div class="input-icon">
                <i class="fa fa-envelope"></i>
                <input type="email" id="signin-email" placeholder="Email Address" />
            </div>

            <div class="input-icon">
                <i class="fa fa-lock"></i>
                <input type="password" id="signin-password" placeholder="Password" />
            </div>

            <button onclick="signIn()">Sign In</button>
            <div id="signin-message-box" class="message-box"></div>
        </div>

        <div class="auth-divider"><span>or</span></div>

        <div class="auth-switch">
            <span id="toggle-text">Already have an account? </span>
            <a href="#" id="switch-link">Sign In</a>
        </div>


    </div>
</body>

</html>
